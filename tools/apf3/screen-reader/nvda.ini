# Dedicated CONTIGO APF3 profile. Never install or copy to the user's NVDA profile.
schemaVersion = 25
[general]
    language = es
    saveConfigurationOnExit = False
    askToExit = False
    playStartAndExitSounds = False
    loggingLevel = IO
    showWelcomeDialogAtStartup = False
[speech]
    synth = auto
[speechViewer]
    showSpeechViewerAtStartup = True
    autoPositionWindow = True
[keyboard]
    NVDAModifierKeys = 7
    keyboardLayout = desktop
    speakTypedCharacters = 0
    speakTypedWords = 0
[mouse]
    enableMouseTracking = False
[update]
    autoCheck = False
    startupNotification = False
    allowUsageStats = False
    askedAllowUsageStats = True
[addonStore]
    automaticUpdates = disabled
[remote]
    enabled = False
